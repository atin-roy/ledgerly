version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: ledgerly-postgres
    environment:
      POSTGRES_USER: ledgerly_user
      POSTGRES_PASSWORD: ledgerly_password
      POSTGRES_DB: ledgerly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly_user -d ledgerly"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
