spring.application.name=finance-backend

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/finance}
spring.datasource.username=${DATABASE_USERNAME:dev}
spring.datasource.password=${DATABASE_PASSWORD:dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:ledgerly-dev-secret-key-must-be-at-least-256-bits-long-for-hs256}
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=604800000

# Server Configuration
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Logging (Development defaults)
logging.level.root=INFO
logging.level.dev.atinroy.ledgerly=DEBUG
logging.level.org.springframework.security=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# Application Info
info.app.name=@project.name@
info.app.version=@project.version@
info.app.description=@project.description@

# Request Size Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB

# Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
