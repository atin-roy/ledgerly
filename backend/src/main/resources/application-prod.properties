# Production Configuration for Ledgerly API
# This file contains production-specific settings that override application.properties

# Database Configuration - MUST be provided via environment variables in production
# 1. Force the JDBC prefix and construct the URL manually

# 3. Keep the driver explicit (just in case)
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate SQL logging disabled for production performance
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JPA/Hibernate - Production safety settings
# Using 'update' to allow schema creation/updates (safe for most cases)
# Change to 'validate' once schema is stable and using migrations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Essential for cloud deployments (Railway, Heroku, etc.)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Database Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JWT Configuration - MUST be provided via environment variable
jwt.secret=${JWT_SECRET}

# Logging - Production levels
logging.level.root=WARN
logging.level.dev.atinroy.ledgerly=INFO
logging.level.org.springframework.security=INFO
logging.level.dev.atinroy.ledgerly.security=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Actuator - Restrict to essential endpoints only
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator

# Server Configuration
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Security
spring.security.filter.dispatcher-types=request,error,async

# Request Size Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB

# Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# CORS Configuration - Allow frontend origins (comma-separated, supports wildcards)
# Default allows all Vercel deployments. Override with specific domain in production for security.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.vercel.app,http://localhost:3000}
