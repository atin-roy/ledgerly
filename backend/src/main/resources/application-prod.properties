# Production configuration — overrides application.properties
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway manages schema in production; Hibernate only validates
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JWT — must be set via env var
jwt.secret=${JWT_SECRET}

# Logging
logging.level.root=WARN
logging.level.dev.atinroy.ledgerly=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Server
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Security
spring.security.filter.dispatcher-types=request,error,async

# API docs stay off outside development
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Auth rate limiting — Caddy fronts the app, so the first X-Forwarded-For hop is the client
auth.rate-limit.requests-per-minute=15
auth.rate-limit.trust-forwarded-for=true

# Request size limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB

# Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# CORS — must be set explicitly; no wildcard default
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
