version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerly-postgres
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d finance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
